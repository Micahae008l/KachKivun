# Watches kachkivun.com and everything behind it (DB, AI key and live AI
# requests, email, payments config, SSL) and pings you in Slack:
#   - every morning: a full report, good or bad
#   - every hour: silent while healthy; one alert when something breaks, one when it recovers
# The checks and the message layout live in scripts/health-check.mjs.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   SLACK_WEBHOOK_URL   — the Slack incoming webhook
#   HEALTH_CHECK_TOKEN  — the same random value as HEALTH_CHECK_TOKEN in server/.env on the API server
#   SLACK_USER_ID       — your Slack member ID (U…), so the message pings you; without it, @here
name: Health check

on:
  schedule:
    - cron: "0 5 * * *" # morning report: 08:00 Israel summer time, 07:00 winter
    - cron: "17 * * * *" # hourly watch
  workflow_dispatch: {}

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/health-check.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore last result
        uses: actions/cache/restore@v4
        with:
          path: .health-state.json
          key: health-state-${{ github.run_id }}
          restore-keys: health-state-

      - name: Check and tell Slack
        run: node scripts/health-check.mjs
        env:
          MODE: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 * * * *') && 'watch' || 'report' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
          HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}

      - name: Remember this result
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .health-state.json
          key: health-state-${{ github.run_id }}
