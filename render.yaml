# Deploy API only: https://dashboard.render.com → New → Blueprint → connect this repo.
# Frontend goes to Cloudflare (see DEPLOY.md).
services:
  - type: web
    name: kachkivun-api
    runtime: node
    rootDir: server
    # Paid Starter: free instances sleep after 15min idle and cold-start ~50s,
    # which surfaced in the browser as a failed OTP request.
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_DAYS
        value: "30"
      - key: OPENAI_API_KEY
        sync: false
      - key: DEFAULT_USER_TOKEN_CAP
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: PERSONALIZED_FUNNEL_V2
        value: "true"
      - key: PAYWALL_ENABLED
        value: "false"
      - key: PAYWALL_LAUNCH_AT
        sync: false
      - key: PAYMENTS_PROVIDER
        value: grow_link
      - key: GROW_PAYMENT_LINK_URL
        sync: false
      - key: GROW_LINK_WEBHOOK_SECRET
        sync: false
      - key: GROW_WEBHOOK_KEY
        sync: false
      - key: GROW_LINK_METHODS
        value: card
      - key: BUSINESS_LEGAL_NAME
        sync: false
      - key: BUSINESS_PHONE
        sync: false
      - key: BUSINESS_ADDRESS
        sync: false
      - key: BUSINESS_CONTACT_EMAIL
        sync: false
      - key: CANCELLATION_URL
        sync: false
      - key: GROW_CALLBACK_AUTH_CONFIRMED
        value: "false"
      - key: GROW_DOMAIN_REVIEW_APPROVED
        value: "false"
      - key: ISRAELI_LEGAL_REVIEW_CONFIRMED
        value: "false"
      - key: PAYMENT_WEBHOOK_RATE_LIMIT_MAX
        value: "600"
      - key: PAYMENT_WEBHOOK_RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: ADMIN_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
