<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reels 2026-10-24</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@500;800;900&display=swap');
:root{--g:oklch(0.82 0.16 128);--bg:#07090b;--fg:#f4f6f8;--mut:#a3abb5;--card:#11151a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Heebo,sans-serif;padding:28px 16px 60px}
h1{font-size:32px;font-weight:900;text-align:center}
p.sub{color:var(--mut);text-align:center;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;max-width:1500px;margin:28px auto 0}
.card{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:12px}
video{width:100%;aspect-ratio:9/16;border-radius:14px;background:#000;display:block}
.card h2{font-size:20px;font-weight:900;margin:12px 4px 2px}
.card span{display:block;color:var(--mut);font-size:14px;margin:0 4px}
.n{color:var(--g);font-weight:900}
</style>
</head>
<body>
<h1>קח כיוון: 6 רילס</h1>
<p class="sub">לפי סדר הפרסום. הכיתובים ב־captions.md</p>
<div class="grid">
  <div class="card"><video src="out/stereotypes.mp4" controls playsinline preload="metadata"></video><h2><span class="n">1</span> סטריאוטיפים</h2><span>תייגו חבר · מוזיקה</span></div>
  <div class="card"><video src="out/navy.mp4" controls playsinline preload="metadata"></video><h2><span class="n">2</span> חיל הים: נחשו את התפקיד</h2><span>חידון · מוזיקה</span></div>
  <div class="card"><video src="out/matkal.mp4" controls playsinline preload="metadata"></video><h2><span class="n">3</span> מטכ״ל או שייטת</h2><span>VS · קריינות</span></div>
  <div class="card"><video src="out/intel.mp4" controls playsinline preload="metadata"></video><h2><span class="n">4</span> מסלולי מיון למודיעין</h2><span>מד דפ״ר · קריינות</span></div>
  <div class="card"><video src="out/base.mp4" controls playsinline preload="metadata"></video><h2><span class="n">5</span> בסיס פתוח או סגור</h2><span>זה או זה · מוזיקה</span></div>
  <div class="card"><video src="out/placement.mp4" controls playsinline preload="metadata"></video><h2><span class="n">6</span> POV: השיבוץ</h2><span>3 צעדים · קריינות</span></div>
</div>
</body>
</html>
