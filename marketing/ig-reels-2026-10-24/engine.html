<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<!-- Reel engine v2, 1080x1920. engine.html?reel=<id> plays REELS[id] from reels.js. Every frame is render(t); record.mjs records it.
     Built for retention: the hook is on screen at frame 0, something changes every 1-2 beats (120 BPM), cuts land on the beat,
     text stays inside the Reels safe zone (y 300-1250, clear of the right rail). -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800;900&family=JetBrains+Mono:wght@700;800&display=block');
:root{--g:oklch(0.82 0.16 128);--gd:oklch(0.62 0.12 130);--red:oklch(0.64 0.23 25);--bg:#07090b;--fg:#f4f6f8;--mut:#a3abb5;--card:rgba(16,20,25,.86);--line:rgba(255,255,255,.12)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:Heebo,sans-serif;color:var(--fg);position:relative}
.g{color:var(--g)}
.mono{font-family:'JetBrains Mono',monospace}
#stage{position:absolute;inset:0;will-change:transform}
.scene{position:absolute;inset:0;display:none;overflow:hidden;will-change:transform}
.photo{position:absolute;inset:-40px;background-size:cover;background-position:center;will-change:transform}
.shade{position:absolute;inset:0}
.cap{position:absolute;left:70px;right:70px;text-align:center;font-weight:900;line-height:1.12;text-shadow:0 6px 30px rgba(0,0,0,.75),0 2px 4px rgba(0,0,0,.9)}
.cap .w{display:inline-block;margin:0 .14em;will-change:transform}
.pill{display:inline-block;background:var(--g);color:#0b1004;padding:0 .24em .04em;border-radius:.2em;text-shadow:none;transform:rotate(-2deg);box-shadow:0 10px 40px oklch(0.82 0.16 128/.35)}
.pill.red{background:var(--red);color:#fff;box-shadow:0 10px 40px oklch(0.64 0.23 25/.4)}
.pill.white{background:#fff;color:#0b0d10;box-shadow:0 10px 40px rgba(255,255,255,.25)}
.kick{position:absolute;left:0;right:0;text-align:center;font-size:40px;font-weight:800;letter-spacing:.04em;color:var(--g);text-shadow:0 2px 10px rgba(0,0,0,.8)}
.box{position:absolute;left:80px;right:80px;border-radius:40px;background:var(--card);border:2px solid var(--line);backdrop-filter:blur(14px);padding:40px 46px}
.box.fact{border-color:oklch(0.82 0.16 128/.7);background:rgba(18,26,12,.9)}
.box .lab{font-size:34px;font-weight:800;color:var(--mut);margin-bottom:10px}
.box.fact .lab{color:var(--g)}
.box .txt{font-size:58px;font-weight:900;line-height:1.16}
.stamp{position:absolute;border:10px solid var(--red);color:var(--red);font-weight:900;font-size:84px;padding:0 34px;border-radius:22px;background:rgba(7,9,11,.6);letter-spacing:.02em}
#grain{position:absolute;inset:-100px;opacity:.07;pointer-events:none;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#brand{position:absolute;left:70px;top:300px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:30px;opacity:.9;text-shadow:0 2px 8px rgba(0,0,0,.8);z-index:3}
#bar{position:absolute;left:0;top:0;height:6px;background:var(--g);z-index:3}
.amb{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;width:760px;height:760px;border-radius:50%;filter:blur(90px);opacity:.2;mix-blend-mode:screen}
.dot{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff}
.giant{position:absolute;left:-200px;white-space:nowrap;font-weight:900;font-size:420px;line-height:1;color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.07);letter-spacing:-.02em}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico svg *{stroke-dasharray:1;stroke-dashoffset:var(--d,0)}
#subs{position:absolute;left:60px;right:60px;top:1295px;text-align:center;z-index:4;font-weight:900;font-size:52px;line-height:1.3}
#subs span.box{display:inline;background:rgba(7,9,11,.78);padding:6px 18px;border-radius:14px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
#subs b{font-weight:900;color:#fff;opacity:.55}
#subs b.on{opacity:1;color:var(--g)}
#subs b.done{opacity:1}
#credit{position:absolute;right:70px;top:256px;font-size:19px;color:rgba(255,255,255,.55);direction:ltr;z-index:3}
</style>
</head>
<body>
<div id="stage"></div>
<div id="grain"></div>
<div id="vig"></div>
<div id="flash"></div>
<div id="brand"><svg viewBox="0 20 200 186" width="36" height="34"><path d="M100 0 L170 66 L140 66 L100 28 L60 66 L30 66 Z" fill="#c9de9f" transform="translate(0 30)"/><path d="M100 0 L170 66 L140 66 L100 28 L60 66 L30 66 Z" fill="oklch(0.70 0.11 128)" opacity="0.85" transform="translate(0 80)"/><path d="M100 0 L170 66 L140 66 L100 28 L60 66 L30 66 Z" fill="#6f8a45" opacity="0.55" transform="translate(0 130)"/></svg>קח כיוון</div>
<div id="credit"></div>
<div id="bar"></div>
<div id="subs"></div>
<script src="icons.js"></script>
<script src="reels.js"></script>
<script>
// ---------- helpers shared with reels.js ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const pr = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eo5 = (x) => 1 - Math.pow(1 - x, 5);
const eb = (x) => { const c1 = 1.9, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const IMG = { "slide-4": "../../src/assets/hero-slideshow/slide-4.jpg", "slide-6": "../../src/assets/hero-slideshow/slide-6.jpg", "slide-7": "../../src/assets/hero-slideshow/slide-7.jpg",
  "slide-10": "../../src/assets/hero-slideshow/slide-10.jpg", dawn: "../../src/assets/gibush/dawn.jpg", dune: "../../src/assets/gibush/dune.jpg" };
const CREDIT = { "slide-4": "Photo: Israel Defense Forces, CC BY 2.0", "slide-6": "Photo: Israel Defense Forces, CC BY 2.0", "slide-7": "Photo: Israel Defense Forces, CC BY 2.0",
  "slide-10": "Photo: U.S. Air Force / A1C Trevor Bell, public domain", dawn: "Photo: Israel Defense Forces, CC BY 2.0", dune: "Photo: מקף־עברי, CC0" };

function makeH(scene, sceneStart) {
  const H = {
    el(tag, css, parent, html) { const e = document.createElement(tag); if (css) e.style.cssText = css; if (html != null) e.innerHTML = html; (parent || scene.c).appendChild(e); return e; },
    cue(t, kind) { CUES.push([sceneStart + t, kind]); },
    flash(t, amt = 0.55) { FLASHES.push([sceneStart + t, amt]); },
    shake(t, amp = 22) { SHAKES.push([sceneStart + t, amp]); },
    st(e, o, tr) { e.style.opacity = o; e.style.transform = tr || "none"; },
    // full-bleed photo with slow push (Ken Burns); returns upd(t)
    photo(name, { dark = 0.55, from = 1.12, to = 1.0, x = 0, pos = "center", tint } = {}) {
      const back = H.el("div", "position:absolute;inset:0"); scene.c.prepend(back);
      back.style.zIndex = 0;
      const p = H.el("div", `background-image:url('${IMG[name]}');background-position:${pos}`, back); p.className = "photo";
      H.el("div", `background:linear-gradient(180deg,rgba(7,9,11,${dark}) 0%,rgba(7,9,11,${dark * 0.6}) 40%,rgba(7,9,11,${Math.min(0.96, dark + 0.35)}) 100%)${tint ? `,${tint}` : ""}`, back).className = "shade";
      scene.credit = CREDIT[name];
      return (t) => { const k = t / scene.dur; p.style.transform = `scale(${lerp(from, to, eo(k))}) translateX(${x * k}px)`; };
    },
    // solid / gradient background with a slow drifting glow
    color(c1, c2) {
      const back = H.el("div", "position:absolute;inset:0"); scene.c.prepend(back);
      H.el("div", `position:absolute;inset:0;background:linear-gradient(160deg,${c1},${c2})`, back);
      const glow = H.el("div", "position:absolute;inset:0", back);
      return (t) => { glow.style.background = `radial-gradient(900px 900px at ${50 + 30 * Math.sin(t * 0.9)}% ${35 + 20 * Math.cos(t * 0.7)}%,rgba(255,255,255,.08),transparent 70%)`; };
    },
    // kinetic caption: words punch in one by one. "*word*" = green pill, "~word~" = red pill, "^word^" = white pill, "|" = line break
    words(text, { y = 700, size = 120, at = 0, stagger = 0.16, kind = "punch", parent } = {}) {
      const c = H.el("div", `top:${y}px;font-size:${size}px`, parent); c.className = "cap";
      const parts = text.split(" ").map((w) => {
        const cls = { "*": "pill", "~": "pill red", "^": "pill white" }[w[0]] || "";
        const clean = w.replace(/[*~^]/g, "");
        if (w === "|") { H.el("br", "", c); return null; }
        const s = H.el("span", "", c, cls ? `<span class="${cls}">${clean}</span>` : clean); s.className = "w";
        return s;
      }).filter(Boolean);
      parts.forEach((_, i) => H.cue(at + i * stagger, i === parts.length - 1 ? "pop" : "tick"));
      return (t) => parts.forEach((s, i) => {
        const a = at + i * stagger;
        if (kind === "punch") H.st(s, eo(pr(t, a, a + 0.08)), `scale(${lerp(1.55, 1, eo5(pr(t, a, a + 0.22)))})`);
        else H.st(s, eo(pr(t, a, a + 0.18)), `translateY(${(1 - eo(pr(t, a, a + 0.3))) * 70}px)`);
      });
    },
    // big slam: element scales down from huge with a shake + flash
    slam(e, at, { from = 2.4, flash = 0.35, shake = 26, sfx = "slam" } = {}) {
      H.cue(at, sfx); if (flash) H.flash(at, flash); if (shake) H.shake(at, shake);
      return (t) => H.st(e, pr(t, at, at + 0.06), `scale(${lerp(from, 1, eo5(pr(t, at, at + 0.22)))}) rotate(${e.dataset.rot || 0}deg)`);
    },
    rise(e, at, dist = 80, sfx = "whoosh") {
      if (sfx) H.cue(at, sfx);
      return (t) => H.st(e, eo(pr(t, at, at + 0.2)), `translateY(${(1 - eo5(pr(t, at, at + 0.4))) * dist}px)`);
    },
    slideX(e, at, dist = -900, sfx = "whoosh") {
      if (sfx) H.cue(at, sfx);
      return (t) => H.st(e, eo(pr(t, at, at + 0.12)), `translateX(${(1 - eo5(pr(t, at, at + 0.38))) * dist}px)`);
    },
    // big line icon that draws itself in, then floats gently
    icon(name, { x = 390, y = 1000, size = 300, color = "var(--g)", at = 0.2, glow = true, op = 1 } = {}) {
      const e = H.el("div", `position:absolute;left:${x}px;top:${y}px;width:${size}px;height:${size}px;color:${color};opacity:${op};${glow ? `filter:drop-shadow(0 0 30px ${color})` : ""}`, null,
        `<svg viewBox="0 0 24 24">${ICONS[name] || ""}</svg>`);
      e.className = "ico";
      H.cue(at, "whoosh");
      return (t) => { e.style.setProperty("--d", 1 - eo(pr(t, at, at + 0.7))); e.style.opacity = op * pr(t, at, at + 0.05); e.style.transform = `translateY(${Math.sin((t - at) * 2.2) * 10}px) scale(${lerp(0.85, 1, eo(pr(t, at, at + 0.5)))})`; };
    },
    giant(text, { y = 1250, speed = 60 } = {}) {
      const g = H.el("div", `top:${y}px`, scene.amb, text); g.className = "giant";
      return (t) => { g.style.transform = `translateX(${-speed * t}px)`; };
    },
    fadeOut(e, at, d = 0.2) { return (t) => { if (t > at) e.style.opacity = 1 - pr(t, at, at + d); }; },
  };
  return H;
}

// ---------- timeline ----------
const P = new URLSearchParams(location.search);
const REEL = REELS[P.get("reel")];
const stage = document.getElementById("stage");
const CUES = [], FLASHES = [], SHAKES = [];
// voice timing from record.mjs: TIMING[scene] = [line seconds, ...]. Each scene stretches to fit its lines; scene.vo = line start times.
const TIMING_RAW = JSON.parse(P.get("timing") || "null");
const TIMING = TIMING_RAW && (TIMING_RAW.scenes || TIMING_RAW);
const TEXTS = (TIMING_RAW && TIMING_RAW.texts) || null;
const SUBS = [];
window.VO = [];
let T = 0;
const SC = REEL.scenes.map((def, i) => {
  const c = document.createElement("div"); c.className = "scene"; stage.appendChild(c);
  const scene = { c, a: T, dur: def.dur, vo: null };
  if (TIMING && TIMING[i] && TIMING[i].length) {
    let at = def.voStart ?? 0.2;
    scene.vo = TIMING[i].map((d, j) => {
      const s = at; window.VO.push([T + s, i, j]);
      if (TEXTS && TEXTS[i] && TEXTS[i][j] && def.subs !== false) SUBS.push({ a: T + s, b: T + s + d, text: TEXTS[i][j] });
      at += d + 0.08; return s;
    });
    scene.dur = Math.max(def.dur, Math.ceil((at + (def.tail ?? 0.45)) * 2) / 2);
  }
  const H = makeH(scene, T);
  if (def.ambient !== false) {
    const amb = H.el("div", ""); amb.className = "amb"; scene.amb = amb;
    const tint = def.tint || REEL.tint || ["oklch(0.62 0.14 130)", "oklch(0.5 0.12 250)"];
    const blobs = tint.map((c, k) => { const b = H.el("div", `background:${c}`, amb); b.className = "blob"; return b; });
    const rnd = (k) => { const x = Math.sin(k * 127.1 + i * 31.7) * 43758.5453; return x - Math.floor(x); };
    const dots = Array.from({ length: 26 }, (_, k) => { const d = H.el("div", `left:${rnd(k) * 1080}px;opacity:${0.08 + rnd(k + 50) * 0.22};transform:scale(${0.5 + rnd(k + 9) * 1.4})`, amb); d.className = "dot"; return [d, rnd(k + 20) * 1920, 30 + rnd(k + 33) * 70]; });
    const g = def.giant ? H.giant(def.giant, { y: def.giantY ?? 1330 }) : null;
    scene.ambUpd = (t) => {
      const T0 = scene.a + t;
      blobs.forEach((b, k) => { b.style.left = `${-300 + 600 * (0.5 + 0.5 * Math.sin(T0 * 0.35 + k * 2.1))}px`; b.style.top = `${k ? 1050 : -250 + 200 * Math.sin(T0 * 0.27 + k)}px`; });
      dots.forEach(([d, y0, sp]) => { d.style.top = `${((y0 - sp * T0) % 1920 + 1920) % 1920}px`; });
      if (g) g(t);
    };
  }
  if (i > 0) { H.cue(0, def.cut || "cut"); if (def.flash !== false) H.flash(0, 0.4); }
  const ups = [].concat(def.build(H, scene)).filter(Boolean);
  scene.upd = (t) => { if (scene.ambUpd) scene.ambUpd(t); ups.forEach((u) => u(t)); };
  T += scene.dur;
  return scene;
});
window.DUR = T;
window.CUES = CUES.sort((x, y) => x[0] - y[0]);
window.GROOVE = REEL.groove ?? 0;
const flashEl = document.getElementById("flash"), grain = document.getElementById("grain"), bar = document.getElementById("bar"), creditEl = document.getElementById("credit");

const subsEl = document.getElementById("subs");
let subKey = null, subWords = [];
function renderSubs(t) {
  const cur = SUBS.find((x) => t >= x.a - 0.05 && t < x.b + 0.25);
  if (!cur) { subsEl.innerHTML = ""; subKey = null; return; }
  if (subKey !== cur) {
    subKey = cur;
    const words = cur.text.split(/\s+/).filter(Boolean);
    subsEl.innerHTML = `<span class="box">${words.map((w) => `<b>${w}</b>`).join(" ")}</span>`;
    const total = words.reduce((n, w) => n + w.length + 1, 0); let acc = 0;
    subWords = [...subsEl.querySelectorAll("b")].map((el, k) => { const a = cur.a + ((cur.b - cur.a) * acc) / total; acc += words[k].length + 1; return [el, a]; });
  }
  subWords.forEach(([el, a], k) => { const next = subWords[k + 1] ? subWords[k + 1][1] : cur.b; el.className = t >= next ? "done" : t >= a ? "on" : ""; });
  subsEl.style.opacity = eo(pr(t, cur.a - 0.05, cur.a + 0.1));
}
window.render = (t) => {
  renderSubs(t);
  SC.forEach((s, i) => {
    const on = t >= s.a && (t < s.a + s.dur || (i === SC.length - 1));
    s.c.style.display = on ? "block" : "none";
    if (!on) return;
    const lt = t - s.a;
    // zoom punch on every cut
    s.c.style.transform = i === 0 ? "none" : `scale(${lerp(1.07, 1, eo5(pr(lt, 0, 0.3)))})`;
    s.upd(lt);
    creditEl.textContent = s.credit || "";
  });
  let f = 0; for (const [a, amt] of FLASHES) if (t >= a) f = Math.max(f, amt * (1 - pr(t, a, a + 0.14)));
  flashEl.style.opacity = f;
  let sx = 0, sy = 0;
  for (const [a, amp] of SHAKES) if (t >= a && t < a + 0.35) { const k = 1 - pr(t, a, a + 0.35); sx += Math.sin(t * 93) * amp * k; sy += Math.cos(t * 71) * amp * k; }
  stage.style.transform = `translate(${sx}px,${sy}px)`;
  grain.style.transform = `translate(${(Math.floor(t * 24) * 37) % 100}px,${(Math.floor(t * 24) * 53) % 100}px)`;
  bar.style.width = `${(t / T) * 100}%`;
};
render(0);
document.fonts.ready.then(() => { const imgs = [...new Set(Object.values(IMG))].map((src) => new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = src; })); return Promise.all(imgs); })
  .then(() => { render(0); window.__ready = true; });
</script>
</body>
</html>
